<!--
  Correo que recibe quien se registra. Se pega en el panel de Supabase:
  Authentication > Emails > Templates > «Confirm signup».
  Asunto: Confirma tu cuenta de DomusRaíz
-->
<div style="font-family: Arial, Helvetica, sans-serif; color: #1f2933; max-width: 480px; margin: 0 auto; padding: 24px">
  <h2 style="color: #0f4c81; margin: 0 0 16px">Confirma tu cuenta</h2>
  <p style="line-height: 1.5">Gracias por registrarte en DomusRaíz. Para activar tu cuenta, abre este enlace:</p>
  <p style="margin: 24px 0">
    <a
      href="{{ .ConfirmationURL }}"
      style="background: #0f4c81; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold"
      >Confirmar mi cuenta</a
    >
  </p>
  <p style="line-height: 1.5; color: #52606d; font-size: 14px">
    Si no creaste una cuenta en DomusRaíz, ignora este correo.
  </p>
</div>
