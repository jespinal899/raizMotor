<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: la página llega hasta los bordes del teléfono y la barra de abajo se aparta de la muesca. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Instalable en la pantalla de inicio: abre sin la barra del navegador, con su ícono y su nombre. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DomusRaíz" />
    <meta
      name="description"
      content="Casas, apartamentos y terrenos en un solo lugar, sin comisiones ocultas."
    />
    <title>DomusRaíz</title>
    <!-- seo: la ficha de cada anuncio cambia este bloque por el suyo (api/_lib/seo.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DomusRaíz" />
    <meta property="og:locale" content="es_HN" />
    <meta property="og:title" content="DomusRaíz" />
    <meta
      property="og:description"
      content="Casas, apartamentos y terrenos en un solo lugar, sin comisiones ocultas."
    />
    <meta name="twitter:card" content="summary" />
    <!-- /seo -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
