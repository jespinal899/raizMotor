name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Mínimo privilegio: el pipeline solo lee el código. Para publicar usa las credenciales de Vercel.
permissions:
  contents: read

# En pull requests se cancela la ejecución anterior; en master nunca se interrumpe un despliegue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build

  # Contra un Supabase local con todas las migraciones: comprueba que se aplican sin errores, los permisos de la
  # base de datos (supabase/tests) y el recorrido del sitio en un navegador de verdad (e2e/).
  integration:
    name: Base de datos y punta a punta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar la herramienta de Supabase
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Levantar Supabase con las migraciones
        # Solo lo que usan las pruebas: base de datos, cuentas, API, fotos y el buzón de prueba (Mailpit),
        # donde llegan los códigos de verificación que las pruebas leen.
        run: supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,realtime,postgres-meta

      - name: Pruebas de la base de datos
        run: supabase test db

      - name: Compilar el sitio contra el Supabase local
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" npx vite build

      - name: Instalar el navegador de las pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        # La clave secreta del Supabase local la usan solo las pruebas, para hacer lo que haría el equipo
        # (aprobar un plan de pago). El sitio compilado no la tiene.
        run: |
          eval "$(supabase status -o env | grep -E '^SECRET_KEY=')"
          SUPABASE_SECRET_KEY="$SECRET_KEY" npx playwright test

      - name: Guardar el rastro de las pruebas que fallaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Solo publica lo que pasó el linter y las pruebas. Vercel ya no despliega por su cuenta: `vercel.json`
  # desactiva su despliegue automático, para que este sea el único camino al sitio publicado.
  deploy:
    name: Publicar en Vercel
    needs: [verify, integration]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Versión fija de la herramienta de Vercel: la misma en cada despliegue.
      VERCEL_CLI: vercel@63.1.0
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # Sin credenciales no hay forma de publicar: se dice a las claras en lugar de dar el despliegue por hecho.
      - name: Comprobar las credenciales de Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error title=No se publicó::Faltan los secretos VERCEL_TOKEN, VERCEL_ORG_ID o VERCEL_PROJECT_ID. Añádelos en Settings > Secrets and variables > Actions y vuelve a ejecutar este workflow."
            exit 1
          fi

      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Traer la configuración del proyecto de Vercel
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Sin Supabase el sitio compila igual, pero guarda los anuncios solo en el navegador de quien publica.
      # Tampoco se publica con una clave privilegiada en una variable VITE_, que viajaría dentro del sitio.
      - name: Comprobar las variables de producción
        run: node .github/scripts/checkProductionEnv.mjs

      - name: Compilar para Vercel
        run: npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"

      # Si Vercel rechaza la publicación, su motivo sale como aviso del trabajo: se lee sin abrir el registro.
      - name: Publicar
        env:
          NO_COLOR: 1
        run: |
          if ! npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deploy.log 2>&1; then
            cat deploy.log
            reason="$(grep -i 'error' deploy.log | tail -n 3 | tr '\n' ' ')"
            echo "::error title=Vercel no publicó::${reason:-Mira el registro de este paso.}"
            # «Project not found» no dice cuál de los secretos falla: se averigua sin mostrar ninguno.
            if grep -q 'Project not found' deploy.log; then node .github/scripts/reportVercelDiagnosis.mjs; fi
            exit 1
          fi
          cat deploy.log
