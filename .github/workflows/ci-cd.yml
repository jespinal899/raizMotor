name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Mínimo privilegio por defecto; cada job amplía solo lo que necesita.
permissions:
  contents: read

# En pull requests se cancela la ejecución anterior; en master nunca se interrumpe un despliegue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub Pages sirve el sitio bajo /<repositorio>/, no en la raíz del dominio.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build -- --base="$BASE_PATH"

      # Pages no reescribe rutas: sin esto, recargar /propiedades devolvería 404 en vez de la app.
      - name: Preparar rutas de la SPA
        run: cp dist/index.html dist/404.html

      - name: Guardar el sitio compilado
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages-status:
    name: Comprobar GitHub Pages
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Consultar la configuración de Pages
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          build_type="$(gh api "repos/$REPOSITORY/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Despliegue omitido::GitHub Pages no está activado con origen «GitHub Actions». Actívalo en Settings > Pages > Build and deployment > Source y vuelve a ejecutar este workflow."
          fi

  deploy:
    name: Publicar en GitHub Pages
    needs: [verify, pages-status]
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
