name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Mínimo privilegio: el pipeline solo lee el código. De publicar el sitio se encarga Vercel.
permissions:
  contents: read

# Una ejecución nueva de la misma rama o pull request cancela la anterior: solo interesa el último estado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Compilar
        run: npm run build
