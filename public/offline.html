<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sin conexión · DomusRaíz</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #ffffff;
        color: #1f1f1f;
        text-align: center;
      }
      main {
        max-width: 22rem;
        display: grid;
        justify-items: center;
        gap: 1rem;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
      }
      p {
        margin: 0;
        color: #6b6b6b;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: 0.625rem;
        background: #0f4c81;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- El logo va dentro de la página: sin conexión no se puede pedir aparte. -->
      <svg viewBox="0 0 36 36" width="64" height="64" aria-hidden="true">
        <rect width="36" height="36" rx="10" fill="#0F4C81" />
        <g transform="translate(6 6)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.75 10.25 12 2.75l9.25 7.5" />
          <path d="M5.75 8.5v6h12.5v-6" />
          <path d="M12 14.5v7" />
          <path d="M12 16.75c-1 2.1-2.9 3.4-5.5 3.75" />
          <path d="M12 16.75c1 2.1 2.9 3.4 5.5 3.75" />
        </g>
      </svg>
      <h1>Sin conexión a internet</h1>
      <p>Revisa tu wifi o tus datos móviles. En cuanto vuelva la conexión, DomusRaíz abre donde lo dejaste.</p>
      <!-- Sin scripts (la política de seguridad no los permite en línea): el enlace vuelve a pedir la página. -->
      <a href="">Reintentar</a>
    </main>
  </body>
</html>
